<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand consistency monitor</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- ?v=5 forces a fresh copy. GitHub Pages can keep the previous files for about 10 minutes. Bump this when the screen must ignore that copy. The same query is on the new import in js/main.js. -->
  <link rel="stylesheet" href="css/dashboard.css?v=5">
</head>
<body>
  <!--
    One screen for the brief: collect, judge, flag.
    Kim asked for the Brand Hub as the correct version, the Brand Agent
    as the judge, and an on-brand score in total and per country.
    None of those Alfa Laval systems are connected. The screen marks
    each one Stand-in or Waiting. On brand by source is Alfa Laval's
    own site, Distributors, Partners, Other websites, and Social. A partner is still
    checked. Wilmer starts in js/main.js.
  -->
  <header class="mast">
    <div class="mast-brand">
      <img src="assets/alfa-laval-logo.svg" alt="Alfa Laval" width="140" height="40">
      <div>
        <p class="product-name">Brand consistency monitor</p>
        <p class="product-team">Round Two</p>
      </div>
    </div>
    <div class="mast-actions">
      <button type="button" class="bell" id="alerts-open" aria-haspopup="dialog" aria-controls="alerts-dialog">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 22a2.4 2.4 0 0 0 2.3-1.8h-4.6A2.4 2.4 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5-6.7V3.5a2 2 0 1 0-4 0v.8A7 7 0 0 0 5 11v5l-1.7 1.7A1 1 0 0 0 4 19h16a1 1 0 0 0 .7-1.7L19 16Z"/>
        </svg>
        <span class="bell-count" id="bell-count" hidden>0</span>
        <span class="visually-hidden">Notifications</span>
      </button>
      <button type="button" id="scan">Scan collected pages</button>
    </div>
  </header>

  <main>
    <p class="run-note" id="run-note">Loading the catalogue…</p>
    <section class="kpis" id="kpis" aria-label="This run"></section>
    <section class="links" id="links" aria-label="Brand Hub, Brand Agent, and social feed"></section>
    <section class="coverage" id="speakers" aria-label="On brand by source"></section>
    <section class="coverage" id="coverage" aria-label="On brand by country"></section>

    <section class="board">
      <div class="queue-wrap">
        <h2>Collected pages</h2>
        <div class="queue-head" aria-hidden="true">
          <span>Page</span><span>Source</span><span>Result</span><span>Flags</span>
        </div>
        <div id="queue"></div>
      </div>
      <article class="case" id="case">
        <p>Select a collected page.</p>
      </article>
    </section>
  </main>

  <script type="module" src="js/main.js?v=5"></script>
</body>
</html>
